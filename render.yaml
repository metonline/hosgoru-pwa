services:
  - type: web
    name: hosgoru
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: python webhook_server.py
    envVars:
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production
    plan: free
    healthCheckPath: /
    staticPublicPath: ./
